# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python backend dependencies (requirements.txt at repo root)
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Frontend dependencies (package.json / package-lock.json under src/frontend)
  - package-ecosystem: "npm"
    directory: "/src/frontend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    # Defer react-router v8: GHSA-qwww-vcr4-c8h2 (high, RSC Mode CSRF Bypass,
    # affects react-router 7.12.0-8.2.0) is not exploitable here since this
    # is a plain SPA (BrowserRouter/Routes/Route), not the unstable RSC APIs.
    # The fix needs react-router >=8.3.0, which needs React >=19.2.7, but
    # this repo is on React ^18.2.0. Revisit once React 19 is planned.
    # 7.x patches (including the fix for this advisory) still flow through.
    ignore:
      - dependency-name: "react-router"
        versions: [">=8.0.0"]
      - dependency-name: "react-router-dom"
        versions: [">=8.0.0"]

  # GitHub Actions used in .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
